services:
  - type: web
    name: rag-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_API_KEY
        sync: false
